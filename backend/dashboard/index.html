<!doctype html>
<!-- Structure and labels for Tok's local capture monitor. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tok · Capture monitor</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Tok · Local testing</p><h1>Capture monitor</h1></div>
      <span id="status" class="badge" role="status">Connecting</span>
    </header>
    <section class="panel" aria-labelledby="session-heading">
      <div class="section-heading"><h2 id="session-heading">Session usage</h2><p id="session-total" class="muted">Waiting for the backend.</p></div>
    </section>
    <section class="panel" aria-labelledby="feature-heading">
      <div class="section-heading"><h2 id="feature-heading">Latest features</h2><p id="source" class="muted"></p></div>
      <dl class="metrics" id="metrics"></dl>
      <p id="hint" class="hint muted">Waiting for the backend.</p>
    </section>
    <section class="panel" aria-labelledby="history-heading">
      <div class="section-heading"><h2 id="history-heading">Recent CSV rows</h2><p id="count" class="muted"></p></div>
      <div class="table-scroll">
        <table aria-labelledby="history-heading">
          <thead><tr><th scope="col">Time</th><th scope="col">Source</th><th scope="col">Chars</th><th scope="col">Words</th><th scope="col">Avg. word</th><th scope="col">Punctuation</th><th scope="col">Symbols</th><th scope="col">Longest</th><th scope="col">Vocab</th></tr></thead>
          <tbody id="history"><tr><td colspan="9" class="muted">No rows saved yet.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/dashboard.js"></script>
</body>
</html>
